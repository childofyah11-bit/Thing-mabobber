<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thing-mabobber</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    /* Purple and white checkered dashed border accent at the top */
    .top-dashed-border {
      height: 6px;
      background-image: linear-gradient(90deg, #6366f1 50%, transparent 50%), linear-gradient(90deg, transparent 50%, #ffffff 50%);
      background-size: 20px 3px, 20px 3px;
      background-repeat: repeat-x;
      background-position: top left, bottom left;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col dark:bg-slate-900 dark:text-slate-100">

  <!-- Checkered Dashed Top Border -->
  <div class="top-dashed-border w-full"></div>

  <!-- Header Section -->
  <header class="bg-white border-b border-slate-200 dark:bg-slate-800 dark:border-slate-700 shadow-sm z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-2 font-bold text-xl text-indigo-600 dark:text-indigo-400">
        <i class="fa-solid fa-crosshairs text-red-500 animate-pulse"></i>
        <span>Thing-mabobber</span>
      </div>
      <div class="text-xs text-slate-400 font-mono">No-Trace Privacy Embedder</div>
    </div>
  </header>

  <!-- Main Full-Screen Workspace Drop Area -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 flex flex-col">
    <div class="flex-1 flex flex-col bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
      
      <!-- Expanded Link Drag & Drop Receiver Box Container -->
      <div id="videoDropZone" class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-8 text-center bg-slate-50 dark:bg-slate-900/50 hover:border-indigo-500 transition-all duration-200 min-h-[350px]">
        <div class="max-w-md pointer-events-none">
          <i class="fa-solid fa-link text-5xl text-indigo-500 mb-4 animate-bounce"></i>
          <p class="font-bold text-xl mb-2">Drag any video link directly into this box</p>
          <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Highlight a video URL from your browser address bar (or a link item) and drop it anywhere inside this frame.</p>
          <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-200/60 dark:bg-slate-700 text-xs font-semibold tracking-wide text-slate-600 dark:text-slate-300">
            <i class="fa-brands fa-youtube text-red-500 text-sm"></i> Supports YouTube Videos & Shorts
          </div>
        </div>
      </div>

      <!-- Private Tracking-Free Video Presentation Display Container -->
      <div id="videoPlaybackWrapper" class="mt-4 hidden aspect-video w-full rounded-xl overflow-hidden bg-black shadow-inner border border-slate-900 relative">
        <!-- Floating Close Reset Action Handle Button -->
        <button onclick="unloadVideoPlayer()" class="absolute top-4 right-4 z-50 bg-black/70 hover:bg-red-600 text-white w-10 h-10 rounded-full flex items-center justify-center transition shadow-md group" title="Clear Player / Return to Drop Box">
          <i class="fa-solid fa-xmark text-lg group-hover:scale-110 transition"></i>
        </button>
        <div id="playerFrameTarget" class="w-full h-full"></div>
      </div>

    </div>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setupLinkDragAndDropEngine();
    });

    function setupLinkDragAndDropEngine() {
      const zone = document.getElementById('videoDropZone');

      // Intercept and allow drops over the tracking container box frame
      window.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('border-indigo-500', 'bg-indigo-50/40', 'dark:bg-indigo-950/20');
      });

      window.addEventListener('dragleave', (e) => {
        if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
          resetDropZoneStyles();
        }
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        resetDropZoneStyles();

        // Target and unpack text data transfer objects
        let droppedUrl = e.dataTransfer.getData('text/plain') || e.dataTransfer.getData('text/uri-list');
        
        // Alternative fallback: Check if HTML structural link payload exists
        if (!droppedUrl) {
          const htmlData = e.dataTransfer.getData('text/html');
          if (htmlData) {
            const matches = htmlData.match(/href="([^"]+)"/);
            if (matches && matches[1]) droppedUrl = matches[1];
          }
        }

        if (droppedUrl) {
          parseAndEmbedVideoUrl(droppedUrl.trim());
        } else {
          alert('Could not detect a clean video web link. Make sure to drag the text string link selection.');
        }
      });
    }

    function resetDropZoneStyles() {
      const zone = document.getElementById('videoDropZone');
      zone.className = "flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-8 text-center bg-slate-50 dark:bg-slate-900/50 hover:border-indigo-500 transition-all duration-200 min-h-[350px]";
    }

    // Upgraded URL parser to securely handle standard videos, mobile shares, and shorts
    function extractYouTubeId(url) {
      // Handles shorts layout natively
      if (url.includes('/shorts/')) {
        const parts = url.split('/shorts/');
        if (parts[1]) return parts[1].split(/[?#&]/)[0];
      }
      
      // Handles standard and watch parameter formats
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function parseAndEmbedVideoUrl(url) {
      const ytId = extractYouTubeId(url);
      const zone = document.getElementById('videoDropZone');
      const wrapper = document.getElementById('videoPlaybackWrapper');
      const target = document.getElementById('playerFrameTarget');

      if (ytId) {
        zone.classList.add('hidden');
        wrapper.classList.remove('hidden');
        
        // FIXED: String template correctly routes the real video ID variable into the tracking-free url block
        target.innerHTML = `
          <iframe 
            src="https://youtube-nocookie.com{ytId}?autoplay=1&rel=0" 
            class="w-full h-full" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
          </iframe>`;
        
        wrapper.scrollIntoView({ behavior: 'smooth' });
      } else if (url.match(/\.(mp4|webm|ogg)($|\?)/i)) {
        zone.classList.add('hidden');
        wrapper.classList.remove('hidden');
        target.innerHTML = `<video src="${url}" controls autoplay class="w-full h-full object-contain focus:outline-none"></video>`;
        wrapper.scrollIntoView({ behavior: 'smooth' });
      } else {
        alert('Unsupported link format. Please drop a valid YouTube video link or Shorts URL.');
      }
    }

    function unloadVideoPlayer() {
      document.getElementById('playerFrameTarget').innerHTML = '';
      document.getElementById('videoPlaybackWrapper').classList.add('hidden');
      document.getElementById('videoDropZone').classList.remove('hidden');
    }
  </script>
</body>
</html>
