<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thing-mabobber</title>
  <!-- Tailwind CSS via CDN for clean, immediate styling layout -->
  <script src="https://tailwindcss.com"></script>
  <!-- FontAwesome for the video drop icon -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    /* Purple and white checkered dashed border accent at the top */
    .top-dashed-border {
      height: 6px;
      background-image: linear-gradient(90deg, #6366f1 50%, transparent 50%), linear-gradient(90deg, transparent 50%, #ffffff 50%);
      background-size: 20px 3px, 20px 3px;
      background-repeat: repeat-x;
      background-position: top left, bottom left;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen dark:bg-slate-900 dark:text-slate-100">

  <!-- Checkered Dashed Top Border -->
  <div class="top-dashed-border w-full"></div>

  <!-- Header Header Layout -->
  <header class="bg-white border-b border-slate-200 dark:bg-slate-800 dark:border-slate-700 shadow-sm sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <!-- Branding Title -->
      <div class="flex items-center space-x-2 font-bold text-xl text-indigo-600 dark:text-indigo-400">
        <i class="fa-solid fa-crosshairs text-red-500 animate-pulse"></i>
        <span>Thing-mabobber</span>
      </div>
    </div>
  </header>

  <!-- Main View Workspace Container -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-6">
      <h2 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-video text-indigo-500"></i> Video Player Workspace
      </h2>
      
      <!-- Interactive Drag & Drop Area Interface Frame -->
      <div id="videoDropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-12 text-center bg-slate-50 dark:bg-slate-900/50 hover:border-indigo-500 transition cursor-pointer">
        <i class="fa-solid fa-video-camera text-5xl text-slate-400 mb-3"></i>
        <p class="font-semibold text-lg">Drag & drop your local video file directly here</p>
        <p class="text-xs text-slate-400 mt-2">Or click inside this frame container box to open your file manager</p>
        <p class="text-xs text-indigo-500 mt-1 font-medium">Supports MP4, WebM, and OGG formats natively</p>
        <input type="file" id="videoFileInput" accept="video/*" class="hidden">
      </div>

      <!-- Video Target Stream Rendering Frame Wrapper Block -->
      <div id="videoPlaybackWrapper" class="mt-6 hidden aspect-video w-full rounded-xl overflow-hidden bg-black shadow-inner border border-slate-200 dark:border-slate-700">
        <!-- The video tag element is mounted inside here dynamically when dropped -->
      </div>
    </div>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setupVideoDragAndDropEngine();
    });

    // Main Engine For File Stream Operations 
    function setupVideoDragAndDropEngine() {
      const zone = document.getElementById('videoDropZone');
      const input = document.getElementById('videoFileInput');

      // Click to choose file fallback implementation
      zone.addEventListener('click', () => input.click());

      // Visually highlight drop area boundary when hovering over the zone
      zone.addEventListener('dragover', (e) => { 
        e.preventDefault(); 
        zone.classList.add('border-indigo-500', 'bg-indigo-50/30', 'dark:bg-indigo-950/20'); 
      });

      // Clear boundary highlight styling rules when leaving drop zone region
      zone.addEventListener('dragleave', () => {
        zone.className = "border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-12 text-center bg-slate-50 dark:bg-slate-900/50 hover:border-indigo-500 transition cursor-pointer";
      });

      // Handle item drop parsing actions
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.className = "border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-12 text-center bg-slate-50 dark:bg-slate-900/50 hover:border-indigo-500 transition cursor-pointer";
        if (e.dataTransfer.files.length) {
          playRawLocalVideoBlob(e.dataTransfer.files);
        }
      });

      // Handle raw file input manual selections
      input.addEventListener('change', (e) => {
        if (e.target.files.length) {
          playRawLocalVideoBlob(e.target.files);
        }
      });
    }

    // Instantly renders local video object URL stream arrays directly inside the screen container
    function playRawLocalVideoBlob(files) {
      const videoFile = files[0];
      // Generate a temporary browser RAM blob token link pointer instead of uploading to a remote web server
      const blobUrl = URL.createObjectURL(videoFile);
      const container = document.getElementById('videoPlaybackWrapper');
      
      // Inject standard clean media controls layout structure dynamically
      container.innerHTML = `<video src="${blobUrl}" controls autoplay class="w-full h-full object-contain focus:outline-none"></video>`;
      container.classList.remove('hidden');
      
      // Smoothly scroll down view screen space to focus presentation frames directly
      container.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
