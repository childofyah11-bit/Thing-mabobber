<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thing-mabobber</title>
  <!-- Tailwind CSS via CDN for rapid utility-first modern UI styling -->
  <script src="https://tailwindcss.com"></script>
  <!-- FontAwesome Icons for clean dashboard visual styling -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    /* Custom purple and white checkered dashed-line border accent at the top */
    .top-dashed-border {
      height: 6px;
      background-image: linear-gradient(90deg, #6366f1 50%, transparent 50%), linear-gradient(90deg, transparent 50%, #ffffff 50%);
      background-size: 20px 3px, 20px 3px;
      background-repeat: repeat-x;
      background-position: top left, bottom left;
    }
    /* Hidden utility helper */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    /* Custom calculator styling */
    .calc-btn { @apply bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 p-4 rounded text-xl font-semibold transition; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen transition-colors duration-200 dark:bg-slate-900 dark:text-slate-100">

  <!-- Checkered Dashed Top Border Line -->
  <div class="top-dashed-border w-full"></div>

  <!-- Main Navbar Header Container -->
  <header class="bg-white border-b border-slate-200 dark:bg-slate-800 dark:border-slate-700 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-center justify-between py-3 flex-wrap gap-3">
        <!-- Application Branding Title -->
        <div class="flex items-center space-x-2 font-bold text-xl text-indigo-600 dark:text-indigo-400">
          <i class="fa-solid fa-crosshairs text-red-500 animate-pulse"></i>
          <span>Thing-mabobber</span>
        </div>

        <!-- Global Action Utilities Quickbar -->
        <div class="flex items-center space-x-3">
          <button id="themeToggle" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700" title="Toggle Light/Dark Theme">
            <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
          </button>
          <button id="manualSaveBtn" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700" title="Force Save State">
            <i class="fa-solid fa-floppy-disk text-lg"></i>
          </button>
          <button id="infoBtn" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700" title="Application Info">
            <i class="fa-solid fa-circle-info text-lg"></i>
          </button>
        </div>
      </div>

      <!-- Scannable Multi-tool Horizontal Tabs Selection Track Container -->
      <div class="flex space-x-1 overflow-x-auto no-scrollbar py-2 border-t border-slate-100 dark:border-slate-700 text-sm font-medium">
        <button onclick="switchTab('videos')" id="tab-videos" class="tab-btn px-3 py-2 rounded-md bg-indigo-600 text-white flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-clapperboard"></i> <span>Videos</span></button>
        <button onclick="switchTab('notes')" id="tab-notes" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-pen-to-square"></i> <span>Notes</span></button>
        <button onclick="switchTab('todos')" id="tab-todos" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-square-check"></i> <span>Todos</span></button>
        <button onclick="switchTab('calculator')" id="tab-calculator" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-calculator"></i> <span>Calculator</span></button>
        <button onclick="switchTab('timer')" id="tab-timer" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-stopwatch"></i> <span>Timer</span></button>
        <button onclick="switchTab('text')" id="tab-text" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-file-lines"></i> <span>Text</span></button>
        <button onclick="switchTab('images')" id="tab-images" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-image"></i> <span>Images</span></button>
        <button onclick="switchTab('colors')" id="tab-colors" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-palette"></i> <span>Colors</span></button>
        <button onclick="switchTab('json')" id="tab-json" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-box-open"></i> <span>JSON</span></button>
        <button onclick="switchTab('qrcode')" id="tab-qrcode" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-qrcode"></i> <span>QR Code</span></button>
        <button onclick="switchTab('converter')" id="tab-converter" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-arrow-rotate-left"></i> <span>Converter</span></button>
        <button onclick="switchTab('password')" id="tab-password" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-key"></i> <span>Password</span></button>
        <button onclick="switchTab('markdown')" id="tab-markdown" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-clipboard"></i> <span>Markdown</span></button>
        <button onclick="switchTab('urltools')" id="tab-urltools" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-link"></i> <span>URL Tools</span></button>
        <button onclick="switchTab('base64')" id="tab-base64" class="tab-btn px-3 py-2 rounded-md text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 flex items-center space-x-1 whitespace-nowrap"><i class="fa-solid fa-shuffle"></i> <span>Base64</span></button>
      </div>
    </div>
  </header>

  <!-- Main View Container Layout Matrix -->
  <main class="max-w-7xl mx-auto px-4 py-8">

    <!-- TAB 1: VIDEOS MODULE -->
    <div id="content-videos" class="tab-content active space-y-6">
      <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
        <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-video text-indigo-500"></i> Video Player Workspace</h2>
        <div id="videoDropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-8 text-center bg-slate-50 dark:bg-slate-900/50 hover:border-indigo-500 transition cursor-pointer">
          <i class="fa-solid fa-video-camera text-4xl text-slate-400 mb-2"></i>
          <p class="font-semibold text-lg">Drop videos here or paste a YouTube/Direct URL stream link below</p>
          <p class="text-xs text-slate-400 mt-1">Supports MP4, YouTube Embeds, WebM formats natively</p>
          <input type="file" id="videoFileInput" accept="video/*" class="hidden">
        </div>
        <div class="mt-4 flex gap-2">
          <input type="text" id="videoUrlInput" placeholder="Paste YouTube URL or video direct stream link..." class="flex-1 px-4 py-2 border rounded-lg bg-transparent border-slate-300 dark:border-slate-600 outline-none focus:border-indigo-500">
          <button onclick="loadVideoStream()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg transition">Load Video</button>
        </div>
        <div id="videoPlaybackWrapper" class="mt-6 hidden aspect-video w-full rounded-xl overflow-hidden bg-black shadow-inner">
          <!-- Dynamic media frame container elements inserted by engine -->
        </div>
      </div>
    </div>

    <!-- TAB 2: NOTES MODULE -->
    <div id="content-notes" class="tab-content space-y-4">
      <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
        <h2 class="text-xl font-bold mb-4"><i class="fa-solid fa-pen-to-square text-indigo-500"></i> Persistent Scratchpad Notes</h2>
        <textarea id="notesArea" oninput="autoSaveData()" placeholder="Type whatever you want here... It saves automatically to permanent storage memory!" class="w-full h-80 p-4 border rounded-xl bg-transparent border-slate-300 dark:border-slate-600 focus:border-indigo-500 outline-none resize-y font-mono text-sm leading-relaxed"></textarea>
